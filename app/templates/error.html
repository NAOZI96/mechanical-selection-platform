<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#102a43">
  <title>{{ status_code }}｜机械智选</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css?v=20260813.1">
</head>
<body class="error-page">
  <main class="error-shell">
    <a class="brand" href="/" aria-label="返回首页">
      <span class="brand-mark">M</span>
      <span><strong>机械智选</strong><small>Mechanical Selection Platform</small></span>
    </a>
    <div class="error-layout">
      <div>
        <p class="error-code">{{ status_code }}</p>
        <p class="launch-eyebrow"><span aria-hidden="true"></span> REQUEST NOT COMPLETED</p>
      </div>
      <div>
        <h1>{{ message }}</h1>
        <p>{{ description | default('当前请求没有完成。请检查地址，或返回模块中心继续使用可进入的工程计算工作台。', true) }}</p>
        <div class="error-actions">
          <a class="button button--primary" href="{{ primary_href | default('/', true) }}">{{ primary_label | default('返回平台首页', true) }}</a>
          <a class="button button--secondary" href="{{ secondary_href | default('/#modules', true) }}">{{ secondary_label | default('浏览功能模块', true) }}</a>
        </div>
        <small>请求 ID：<code>{{ request_id }}</code></small>
      </div>
    </div>
  </main>
</body>
</html>

name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --requirement requirements-dev.txt
      - run: ruff format --check app scripts tests
      - run: ruff check .
      - run: node --check app/static/calculator.js
      - run: node --check app/static/engineering-calculator.js
      - run: node --check app/static/home-animation.js
      - run: node --check scripts/verify_calculation_state.mjs
      - run: python -m unittest discover -s tests -v
